name: Build OmniSave Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Python 3.11 (for Chaquopy)
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Bundle ARM64 FFmpeg binary
        run: bash scripts/fetch_ffmpeg_android.sh

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build OmniSave APK
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Prepare APK Artifact
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk dist/OmniSave-v20.12-arm64.apk
          ls -lh dist/OmniSave-v20.12-arm64.apk

      - name: Upload OmniSave APK
        uses: actions/upload-artifact@v4
        with:
          name: OmniSave-APK
          path: dist/OmniSave-v20.12-arm64.apk
          retention-days: 30
